// Skeleton only. Generate a fresh template at https://fabricmc.net/develop/template/
// for your exact MC version and copy its plugin id / dependency lines here.
// (Minecraft 26.x is unobfuscated, so the template uses NO mappings line.)
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"   // check template for current id
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }  // match MC's required Java
